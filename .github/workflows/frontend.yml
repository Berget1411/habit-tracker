name: Frontend CI/CD to GCP

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # Hardcode the project ID as an environment variable
    env:
      PROJECT_ID: spry-sentry-455010-v1 # Use your actual project ID here

    steps:
      - uses: actions/checkout@v4

      # Set up Google Cloud SDK with explicit project ID
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v1"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
          project_id: ${{ env.PROJECT_ID }}

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v1"
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Set up Docker for Artifact Registry
      - name: "Set up Docker for GCP Artifact Registry"
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      # Fetch environment variables from Secret Manager and create .env file
      - name: "Fetch environment variables from Secret Manager"
        run: |
          # Create .env.production file for frontend
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" > ./frontend/.env.production
          # You can add more environment variables here as needed
          cat ./frontend/.env.production

      # Debug to check if project ID is correctly set
      - name: "Debug project ID"
        run: |
          echo "Project ID: ${{ env.PROJECT_ID }}"

      # Build and push the Docker image with explicit project ID and environment file
      - name: "Build and push Docker image"
        run: |
          # Use hardcoded project ID in the image tag
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            -t us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/frontend-repo/frontend:${{ github.sha }} \
            ./frontend
          docker push us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/frontend-repo/frontend:${{ github.sha }}

      # Deploy to Cloud Run with explicit project ID and environment variable
      - name: "Deploy to Cloud Run"
        run: |
          gcloud run deploy frontend \
            --image us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/frontend-repo/frontend:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" \
            --project ${{ env.PROJECT_ID }}
